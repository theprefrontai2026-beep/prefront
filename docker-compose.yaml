# Prefront — full design-time + runtime stack.
#
#   skill-builder        docs -> rules        (FastAPI)         :8000
#   semantic-layer-api   schema introspection / build (design-time API) :8010
#   semantic-mcp-server  templates -> live MCP query tools (HTTP/SSE) :8090
#   api-server           UI companion: audit log + review websocket (Express) :8080
#   ui                   Prefront front-end (React/Vite -> nginx) :5173
#   phoenix              Arize Phoenix trace collector + UI          :6006
#   clickhouse           OOB trace store (ClickHouse)                :8123
#   oob-ingest           Phoenix/OTLP -> ClickHouse + /oob query API :8110
#
# The bundled example datasource is SecureBank (see ./securebank-demo), wired in
# below; the engine itself is domain-independent.
#
# The ui (nginx) reverse-proxies /design -> skill-builder, /design/semantic ->
# semantic-layer-api, and /api (+ /api/ws) -> api-server, so the SPA stays
# same-origin (no CORS).
#
# Quick start:
#   cp .env.example .env   # put your LLM key in it (GROQ_API_KEY=...)
#   docker compose up --build
#
# The LLM key is needed by skill-builder (extract-rules) and semantic-layer (mapper).

name: prefront

# Shared LLM credentials/provider, injected into the services that call an LLM.
x-llm-env: &llm-env
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  SKILLBUILDER_PROVIDER: ${LLM_PROVIDER:-openai}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

# Tracing, injected into every Python service. All services report to ONE
# Phoenix project so a single scenario (orchestrator -> app agent + LLM ->
# Prefront MCP -> governance decision) reads as one trace; service.name keeps
# the spans attributable. Turn it all off with PREFRONT_TRACING=0, or point
# PHOENIX_COLLECTOR_ENDPOINT at your own OTLP/HTTP collector.
x-tracing-env: &tracing-env
  PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006}
  PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-prefront}
  PREFRONT_TRACING: ${PREFRONT_TRACING:-1}

# Out-of-band tap: ONLY the app-layer (ungoverned) agents fan their spans out to
# oob-ingest — nothing inline (Prefront's engine, the governed agent) is tapped.
# The Phoenix pull additionally drops any inline span it sees (OOB_EXCLUDE_*).
x-oob-tap-env: &oob-tap-env
  PREFRONT_TRACE_FANOUT: ${PREFRONT_TRACE_FANOUT:-http://oob-ingest:8110}

# ---------------------------------------------------------------------------
# Keeping Prefront OUT of the inline observability path, at the DEPLOYMENT layer.
#
# The OOB ingester also filters inline spans (OOB_EXCLUDE_*), but filtering is a
# second line of defence — these two anchors stop the spans from ever being
# created, so nothing inline reaches Phoenix either.
#
#   PREFRONT_TRACING: ${PREFRONT_ENGINE_TRACING:-0}
#                   set DIRECTLY on Prefront's own services (engine runtime +
#                   design-time), so they do not trace at all. It is written out
#                   per service rather than merged from an anchor because YAML
#                   merge keys resolve first-wins: *tracing-env already defines
#                   PREFRONT_TRACING, so an anchor listed after it would be
#                   silently ignored. An explicit key always wins. Set
#                   PREFRONT_ENGINE_TRACING=1 to trace Prefront while debugging it.
#   *no-governed-span-env
#                   The demo orchestrators DO trace (their `scenario <id>` span
#                   is the app-agent trace's root), but the governed branch —
#                   the `governed agent` span and every LLM/MCP call under it —
#                   is not recorded.
# ---------------------------------------------------------------------------
x-no-governed-span-env: &no-governed-span-env
  PREFRONT_TRACE_EXCLUDE_SPANS: ${PREFRONT_TRACE_EXCLUDE_SPANS:-governed agent}

services:
  # ---- skill builder's own design-time database ----------------------------
  # Dedicated Postgres for design-time state (documents, clauses, candidate
  # rules, atoms, unresolved items). Separate from the tenant's runtime
  # datasource by design.
  skill-builder-db:
    image: postgres:16
    environment:
      POSTGRES_USER: skillbuilder
      POSTGRES_PASSWORD: skillbuilder
      POSTGRES_DB: skillbuilder
    volumes:
      - skillbuilder_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillbuilder"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- api-server's own database (audit log) -------------------------------
  # Dedicated Postgres so the api-server's drizzle-kit push owns the whole
  # schema (it only manages rule_audit_log) and never touches skill-builder's
  # tables. Kept separate from skill-builder-db by design.
  api-db:
    image: postgres:16
    environment:
      POSTGRES_USER: prefront
      POSTGRES_PASSWORD: prefront
      POSTGRES_DB: prefront_audit
    volumes:
      - api_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefront -d prefront_audit"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- trace collector: Arize Phoenix --------------------------------------
  # Receives OTLP/HTTP spans from every Python service on :6006 and serves the
  # trace UI on the same port. Design-time LLM calls, the demo agents, and each
  # governed decision land here. Not required by the stack — if it is down the
  # exporters just drop spans.
  phoenix:
    image: arizephoenix/phoenix:latest
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data
    ports:
      # Host ports are overridable because 6006/4317 are Phoenix's defaults and a
      # Phoenix you already run locally will own them. If you'd rather use that
      # one, skip this service and set
      #   PHOENIX_COLLECTOR_ENDPOINT=http://host.docker.internal:6006
      - "${PHOENIX_UI_PORT:-6006}:6006"     # UI + OTLP/HTTP  (POST /v1/traces)
      - "${PHOENIX_GRPC_PORT:-4317}:4317"   # OTLP/gRPC (unused by default)

  # ---- OOB observability: ClickHouse + the ingestion/query service ----------
  # Out-of-band (never on a governed call's request path). oob-ingest tails
  # Phoenix's REST API into ClickHouse, additionally accepts the OTLP fan-out
  # tap on /v1/traces, and serves the /oob/* query API the UI's Observability
  # tab reads (nginx proxies /oob/ -> here).
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: prefront
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"   # HTTP interface (also what oob-ingest uses)
      - "${CLICKHOUSE_TCP_PORT:-9000}:9000"    # native protocol (clickhouse-client)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  oob-ingest:
    build: ./oob-ingest
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: prefront
      PHOENIX_URL: ${OOB_PHOENIX_URL:-http://phoenix:6006}
      PHOENIX_PROJECTS: ${OOB_PHOENIX_PROJECTS:-}      # empty = every Phoenix project
      PHOENIX_POLL_SECONDS: ${OOB_POLL_SECONDS:-5}
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-prefront}
      OOB_MODEL_PRICES: ${OOB_MODEL_PRICES:-}
      # Inline exclusions (subtree-wide): Prefront engine spans + the governed agent.
      OOB_EXCLUDE_ATTR_PREFIXES: ${OOB_EXCLUDE_ATTR_PREFIXES:-prefront.}
      OOB_EXCLUDE_SPAN_NAMES: ${OOB_EXCLUDE_SPAN_NAMES:-governed agent,govern }
      OOB_EXCLUDE_SERVICES: ${OOB_EXCLUDE_SERVICES:-}
      # Attributes scrubbed from spans that ARE kept (the harness's scenario root
      # annotates the governed side too).
      OOB_STRIP_ATTR_PREFIXES: ${OOB_STRIP_ATTR_PREFIXES:-scenario.governed_,scenario.expected}
    ports: ["8110:8110"]
    depends_on:
      clickhouse:
        condition: service_healthy
      phoenix:
        condition: service_started

  # ---- service 1: skill builder (docs -> rules) ----------------------------
  skill-builder:
    build: ./skill-builder
    environment:
      <<: [*llm-env, *tracing-env]
      PREFRONT_TRACING: ${PREFRONT_ENGINE_TRACING:-0}   # Prefront service: not traced
      # SQLAlchemy DSN for the design-time Postgres above (psycopg3 driver).
      SKILLBUILDER_DB: postgresql+psycopg://skillbuilder:skillbuilder@skill-builder-db:5432/skillbuilder
      SKILLBUILDER_REGISTRY: /data/skills
      # Always run in debug: stage + per-clause LLM trace to the container logs.
      # Override per-run with `SKILLBUILDER_LOG_LEVEL=INFO docker compose up`.
      SKILLBUILDER_LOG_LEVEL: ${SKILLBUILDER_LOG_LEVEL:-DEBUG}
      # Named (curated) domain packs overlay the DDL-derived schema pack: they
      # supply roles/intents/aliases the schema can't. Set to 0 to ground from
      # the DDL only.
      SKILLBUILDER_NAMED_PACKS: ${SKILLBUILDER_NAMED_PACKS:-1}
    volumes:
      # Bind-mount the artifact registry to the host so generated skill files
      # (skills/<id>/v<ver>/extracted_rules.yaml, per-run artifacts, …) are
      # browsable directly on disk instead of living in a Docker named volume.
      - ./skill-builder-data:/data
    ports: ["8000:8000"]
    depends_on:
      skill-builder-db:
        condition: service_healthy

  # ---- semantic-layer design-time API (Data Connector: schema introspection)
  # Same image as the build job, but long-running: parses uploaded DDL and
  # introspects live databases for the UI's Data Connector tab.
  semantic-layer-api:
    build: ./semantic-layer
    command: ["api", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      <<: [*llm-env, *tracing-env]                     # /build runs the LLM semantic mapper
      PREFRONT_TRACING: ${PREFRONT_ENGINE_TRACING:-0}   # Prefront service: not traced
      SEMANTICLAYER_DB: /data/semanticlayer.db   # persisted templates + approvals
      # Legacy single-publish-path default; per-datasource publishing writes to
      # /artifacts/<datasource_id>/ under this path's grandparent (/artifacts).
      SEMANTICLAYER_PUBLISH_PATH: /artifacts/example/query_templates.yaml
      SEMANTICLAYER_POLICY_PUBLISH_PATH: /artifacts/example/policy.yaml
      # Bundled demo baselines that a datasource "reset" must never wipe.
      SEMANTICLAYER_KEEP_DATASOURCES: securebank-demo,loanpro-demo
    volumes:
      - semanticlayer_data:/data
      - artifacts:/artifacts          # publish writes the approved templates here
    ports: ["8010:8010"]
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach a Postgres on the host

  # ---- service 3: semantic MCP server (templates -> live query tools) ------
  # The engine runtime, serving the bundled SecureBank example artifacts.
  # DISABLED by default while the OOB work is the focus: it sits behind the
  # `mcp` profile, so a plain `docker compose up` does not start it. Opt in with
  #   docker compose --profile mcp up -d semantic-mcp-server
  semantic-mcp-server:
    profiles: ["mcp"]
    build: ./semantic-mcp-server
    command:
      - --templates=/artifacts/securebank-demo/query_templates.yaml
      - serve
      - --http
      - --host=0.0.0.0
      - --port=8090
    environment:
      <<: *tracing-env
      PREFRONT_TRACING: ${PREFRONT_ENGINE_TRACING:-0}   # Prefront runtime: not traced
      DATABASE_URL: ${DATABASE_URL:-postgresql://securebank:securebank@securebank-db:5432/securebank}
      # Governance: enforce the published policy bundle. IDENTITY_QUERY is the
      # DEPLOYMENT's mapping of an identity to caller attributes — it aliases the
      # app schema onto the contract names; Prefront itself assumes no identity
      # table. Identity is resolved per-connection (X-Prefront-Act-As header).
      POLICY_PATH: /artifacts/securebank-demo/policy.yaml
      IDENTITY_QUERY: SELECT user_id, name, email, role FROM users WHERE email = :who
      ENABLE_WRITES: ${ENABLE_WRITES:-0}
      TRACE_PATH: /data/traces.jsonl
    volumes:
      - artifacts:/artifacts:ro
      - mcp_data:/data                # decision traces
    ports: ["8090:8090"]
    depends_on:
      securebank-db:
        condition: service_healthy
      securebank-seed:
        condition: service_completed_successfully

  # ---- api server (new UI companion: audit log + review websocket) ---------
  # Node/Express service backing the new UI's persistent audit log
  # (/api/audit) and collaborative-review presence websocket (/api/ws/review).
  # Reuses the skill-builder design-time Postgres for its rule_audit_log table;
  # drizzle-kit push (idempotent) creates the table on start.
  api-server:
    build:
      context: ./prefront-ui
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://prefront:prefront@api-db:5432/prefront_audit
      PORT: "8080"
      NODE_ENV: production
      # Where POST /api/decisions/refresh runs the live governance catalog. One
      # orchestrator per bundled demo; the request's ?demo= selects which. The
      # bare ORCHESTRATOR_URL is the default for legacy callers — LoanPro, since
      # SecureBank is profile-disabled.
      ORCHESTRATOR_URL: http://loanpro-orchestrator:8098
      ORCHESTRATOR_URL_SECUREBANK: http://securebank-orchestrator:8095
      ORCHESTRATOR_URL_LOANPRO: http://loanpro-orchestrator:8098
    ports: ["8080:8080"]
    depends_on:
      api-db:
        condition: service_healthy

  # ---- PII analyzer (Presidio): guesses which schema fields are PII ---------
  # Design-time only, name-based — the Data Graph's "Detect PII" calls it.
  pii-analyzer:
    build: ./pii-analyzer
    ports: ["8020:8020"]

  # ---- service 4: UI (new workflow-v1 front-end, nginx) --------------------
  ui:
    build:
      context: ./prefront-ui
      dockerfile: Dockerfile.ui
    ports: ["5173:80"]
    depends_on:
      - skill-builder
      - semantic-layer-api
      - api-server
      - pii-analyzer
      - oob-ingest

  # ==========================================================================
  # SecureBank demo — DISABLED by default: every service below sits behind the
  # `securebank` profile, so `docker compose up` does not start it. LoanPro is
  # the active demo. Bring SecureBank back with:
  #     docker compose --profile securebank up -d
  # NOTE: the engine `semantic-mcp-server` (profile `mcp`) is wired to the
  # SecureBank datasource, so enabling it needs BOTH profiles:
  #     docker compose --profile securebank --profile mcp up -d
  #
  # (originally: moved in-repo under ./securebank-demo) — the before/after harness. Its own Postgres + an app-layer agent service
  # (typed business functions, no access-control policy — the realistic "before")
  # + ONE Prefront MCP server (curated artifacts) + the orchestrator the UI's
  # Runtime tab points at (http://localhost:8095). Shares the engine's
  # `artifacts` volume; the demo owns /artifacts/securebank-demo/ so UI
  # publishing to /artifacts/<id>/ never clobbers it.
  # ==========================================================================

  # ---- SecureBank sample datasource (schema + seed auto-apply on first boot)
  securebank-db:
    profiles: ["securebank"]
    image: postgres:16
    environment:
      POSTGRES_USER: securebank
      POSTGRES_PASSWORD: securebank
      POSTGRES_DB: securebank
    volumes:
      - ./securebank-demo/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./securebank-demo/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - securebank_pgdata:/var/lib/postgresql/data
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securebank -d securebank"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- the "before": app-layer agent — typed functions, no access-control policy ----
  securebank-ungoverned:
    profiles: ["securebank"]
    build: ./securebank-demo
    command: ["python", "ungoverned_server.py"]
    environment:
      <<: [*llm-env, *tracing-env, *oob-tap-env]   # OPENAI_API_KEY; OOB tap
      SECUREBANK_DSN: postgresql://securebank:securebank@securebank-db:5432/securebank
      UNGOVERNED_MODEL: gpt-4o-mini
      SECUREBANK_READONLY: "on"          # writes attempted but rolled back
    ports: ["8096:8096"]
    depends_on:
      securebank-db: {condition: service_healthy}

  # ---- seed the curated SecureBank artifacts the MCP serves ----
  # Idempotent copy into the demo-owned /artifacts/securebank-demo/ dir.
  securebank-seed:
    profiles: ["securebank"]
    image: alpine
    command:
      - sh
      - -c
      - mkdir -p /artifacts/securebank-demo &&
        ([ -f /artifacts/securebank-demo/query_templates.yaml ] ||
         cp /src/query_templates.yaml /src/policy.yaml /artifacts/securebank-demo/) &&
        echo "securebank curated artifacts ready in /artifacts/securebank-demo"
    volumes:
      - artifacts:/artifacts
      - ./securebank-demo/policy:/src:ro
    restart: "no"

  # ---- Prefront, exposed as ONE MCP server (the single endpoint the LLM uses)
  # Same engine image as semantic-mcp-server, but serving the demo's curated
  # artifacts against the SecureBank DB; identity resolved per-connection.
  securebank-mcp:
    profiles: ["securebank"]
    build: ./semantic-mcp-server
    command: ["--templates=/artifacts/securebank-demo/query_templates.yaml", "serve", "--http", "--host=0.0.0.0", "--port=8090"]
    environment:
      <<: *tracing-env
      PREFRONT_TRACING: ${PREFRONT_ENGINE_TRACING:-0}   # Prefront runtime: not traced
      IDENTITY_QUERY: SELECT user_id, name, email, role FROM users WHERE email = :who
      DATABASE_URL: postgresql://securebank:securebank@securebank-db:5432/securebank
      POLICY_PATH: /artifacts/securebank-demo/policy.yaml
    volumes:
      - artifacts:/artifacts:ro          # shared with the engine; read-only here
    ports: ["8100:8090"]                 # host 8100 (engine MCP owns 8090)
    depends_on:
      securebank-db: {condition: service_healthy}
      securebank-seed: {condition: service_completed_successfully}

  # ---- the "after" orchestrator: gpt-4o-mini as an MCP CLIENT of the server
  securebank-orchestrator:
    profiles: ["securebank"]
    build: ./securebank-demo
    command: ["python", "demo_server.py"]
    environment:
      <<: [*llm-env, *tracing-env, *no-governed-span-env]   # OPENAI_API_KEY
      GOVERNED_MODEL: gpt-4o-mini
      UNGOVERNED_URL: http://securebank-ungoverned:8096/run
      GOVERNED_MCP_URL: http://securebank-mcp:8090/sse
    ports: ["8095:8095"]
    depends_on:
      securebank-ungoverned: {condition: service_started}
      securebank-mcp: {condition: service_started}

  # ==========================================================================
  # LoanPro demo (in-repo under ./loanpro-demo) — the ACTIVE worked example, a
  # retail loan-origination shop. Same engine image, different domain: its own
  # Postgres + curated artifacts + an app-layer "before" agent + ONE Prefront MCP
  # server + the orchestrator the UI's Runtime tab points at when the LoanPro
  # demo is selected (http://localhost:8098). Shares the engine's `artifacts`
  # volume; the demo owns /artifacts/loanpro-demo/.
  # ==========================================================================

  # ---- LoanPro sample datasource (schema + seed auto-apply on first boot)
  loanpro-db:
    image: postgres:16
    environment:
      POSTGRES_USER: loanpro
      POSTGRES_PASSWORD: loanpro
      POSTGRES_DB: loanpro
    volumes:
      - ./loanpro-demo/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./loanpro-demo/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - loanpro_pgdata:/var/lib/postgresql/data
    ports: ["5435:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanpro -d loanpro"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- the loan shop's OWN tool API, served over MCP (ungoverned) ----------
  # This is the application's API — typed business functions over its Postgres,
  # exposed as MCP tools. No Prefront, no policy, no decision: a call arrives and
  # the SQL runs. Identity is a per-connection header the agent cannot set, but
  # only get_my_applications() honours it — that is the governance gap on show.
  loanpro-app-mcp:
    build: ./loanpro-demo
    command: ["python", "app_mcp_server.py"]
    environment:
      <<: [*tracing-env, *oob-tap-env]   # app-layer, so it IS observed by OOB
      LOANPRO_DSN: postgresql://loanpro:loanpro@loanpro-db:5432/loanpro
      LOANPRO_APP_MCP_PORT: "8102"
      LOANPRO_READONLY: "on"             # writes execute, then roll back
    ports: ["8102:8102"]
    depends_on:
      loanpro-db: {condition: service_healthy}

  # ---- the agent: an LLM that reaches its tools as an MCP CLIENT -----------
  # No DSN here — the agent never touches the database, it only calls tools.
  loanpro-ungoverned:
    build: ./loanpro-demo
    command: ["python", "ungoverned_server.py"]
    environment:
      <<: [*llm-env, *tracing-env, *oob-tap-env]   # OPENAI_API_KEY; OOB tap
      UNGOVERNED_MODEL: gpt-4o-mini
      UNGOVERNED_PORT: "8097"
      LOANPRO_APP_MCP_URL: http://loanpro-app-mcp:8102/sse
    ports: ["8097:8097"]
    depends_on:
      loanpro-app-mcp: {condition: service_started}

  # ---- seed the curated LoanPro artifacts the MCP serves ----
  loanpro-seed:
    image: alpine
    command:
      - sh
      - -c
      - mkdir -p /artifacts/loanpro-demo &&
        ([ -f /artifacts/loanpro-demo/query_templates.yaml ] ||
         cp /src/query_templates.yaml /src/policy.yaml /artifacts/loanpro-demo/) &&
        echo "loanpro curated artifacts ready in /artifacts/loanpro-demo"
    volumes:
      - artifacts:/artifacts
      - ./loanpro-demo/policy:/src:ro
    restart: "no"

  # ---- Prefront, exposed as ONE MCP server (the single endpoint the LLM uses)
  # Prefront's governed MCP for LoanPro. UNUSED — LoanPro has no governed agent
  # any more, so this sits behind the `mcp` profile with the engine runtime.
  loanpro-mcp:
    profiles: ["mcp"]
    build: ./semantic-mcp-server
    command: ["--templates=/artifacts/loanpro-demo/query_templates.yaml", "serve", "--http", "--host=0.0.0.0", "--port=8090"]
    environment:
      <<: *tracing-env
      PREFRONT_TRACING: ${PREFRONT_ENGINE_TRACING:-0}   # Prefront runtime: not traced
      IDENTITY_QUERY: SELECT user_id, name, email, role FROM users WHERE email = :who
      DATABASE_URL: postgresql://loanpro:loanpro@loanpro-db:5432/loanpro
      POLICY_PATH: /artifacts/loanpro-demo/policy.yaml
    volumes:
      - artifacts:/artifacts:ro          # shared with the engine; read-only here
    ports: ["8101:8090"]                 # host 8101 (engine MCP owns 8090, securebank 8100)
    depends_on:
      loanpro-db: {condition: service_healthy}
      loanpro-seed: {condition: service_completed_successfully}

  # ---- scenario orchestrator: runs the catalogue against the app agent -----
  loanpro-orchestrator:
    build: ./loanpro-demo
    command: ["python", "demo_server.py"]
    environment:
      <<: [*llm-env, *tracing-env, *no-governed-span-env]   # OPENAI_API_KEY
      GOVERNED_MODEL: gpt-4o-mini
      LOANPRO_DEMO_PORT: "8098"
      UNGOVERNED_URL: http://loanpro-ungoverned:8097/run
    ports: ["8098:8098"]
    depends_on:
      loanpro-ungoverned: {condition: service_started}

volumes:
  skillbuilder_db:
  api_db:
  semanticlayer_data:
  mcp_data:
  artifacts:
  securebank_pgdata:
  loanpro_pgdata:
  phoenix_data:
  clickhouse_data:
