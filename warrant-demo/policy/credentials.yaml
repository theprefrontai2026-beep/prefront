# Service credentials for the Arcadia demo.
#
# ==========================================================================
# THESE ARE DEMO CREDENTIALS. The secret behind the hash below is written in
# plaintext in docker-compose.warrant.yml and is therefore public. They are
# here so the demo runs authenticated out of the box rather than with the
# door open; they are not secret and must never be reused.
#
# Mint real ones with:
#   python -m warrantservice.credentials new <client-id> --scopes decide,read \
#       --append-to credentials.yaml
# The secret is printed once and never stored - the file keeps only its
# SHA-256, so a leaked file is a list of hashes rather than of working keys.
# ==========================================================================
#
# Note the scope split. The console plays BOTH the control plane (it issues a
# Mission and opens a task) and the gateway (it asks for a decision per call),
# so it holds both sets. A real deployment separates them: a gateway sits on
# every tool call and must not be able to mint consent, or compromising it
# would be the same hole with a password on it.
clients:
- client_id: arcadia-console
  secret_sha256: 817259bd4fbc24d9bdf6fc8ca1810eb9da8935873756801ebbff269403482628
  scopes:
  - decide
  - read
  - mission:issue
  - tree:manage
  - tree:revoke
  - agent-key:register
  - token:issue
  description: 'The Arcadia demo console: control plane and gateway in one process'
