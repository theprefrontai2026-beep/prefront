<title>Warrant Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   A settlement blotter grown into a control plane. The vernacular is
   institutional finance — ruled columns, tabular figures, stamped outcomes —
   because that is the world this governs. Structure encodes state: the spine
   between two ledgers is where a control fires, a severity stripe says what
   needs attention, and nothing is a card unless it is genuinely a separate
   object.
   --------------------------------------------------------------------------- */
:root {
  --ground:#EEF0F3; --surface:#FFFFFF; --sunk:#E4E8ED; --raised:#F7F8FA;
  --ink:#151C26; --ink-soft:#5A6675; --ink-faint:#8A94A1;
  --rule:#D3D8DF; --rule-strong:#AEB7C2; --spine:#151C26;
  --ok:#1F6F4A;   --ok-wash:#E3F0E9;
  --bad:#96242F;  --bad-wash:#F7E4E5;
  --hold:#9A6410; --hold-wash:#F8EEDC;
  --info:#2C4E80; --info-wash:#E6ECF5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:#11151B; --surface:#171D25; --sunk:#0D1116; --raised:#1D242E;
    --ink:#E6EAEF; --ink-soft:#9AA5B2; --ink-faint:#6C7784;
    --rule:#28313B; --rule-strong:#3A4552; --spine:#E6EAEF;
    --ok:#5BBD8C;   --ok-wash:#14291F;
    --bad:#E8737E;  --bad-wash:#2C1518;
    --hold:#D9A44C; --hold-wash:#2B2113;
    --info:#8FB0DE; --info-wash:#16202E;
  }
}
:root[data-theme="dark"] {
  --ground:#11151B; --surface:#171D25; --sunk:#0D1116; --raised:#1D242E;
  --ink:#E6EAEF; --ink-soft:#9AA5B2; --ink-faint:#6C7784;
  --rule:#28313B; --rule-strong:#3A4552; --spine:#E6EAEF;
  --ok:#5BBD8C;   --ok-wash:#14291F;
  --bad:#E8737E;  --bad-wash:#2C1518;
  --hold:#D9A44C; --hold-wash:#2B2113;
  --info:#8FB0DE; --info-wash:#16202E;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums lining-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}

/* --- shell ---------------------------------------------------------------- */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100%}

nav.side{
  background:var(--surface);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
}
.brand{padding:16px 18px 14px;border-bottom:2px solid var(--spine)}
.brand h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:12px;color:var(--ink-faint)}
.side nav{padding:10px 8px;display:flex;flex-direction:column;gap:1px}
.side button{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:none;border:0;border-radius:3px;cursor:pointer;
  padding:7px 10px;font-size:13.5px;color:var(--ink-soft);
}
.side button:hover{background:var(--raised);color:var(--ink)}
.side button[aria-current="true"]{background:var(--sunk);color:var(--ink);font-weight:600}
.side .count{margin-left:auto;font-size:11.5px;font-weight:600;
  padding:0 6px;border-radius:9px;background:var(--hold-wash);color:var(--hold)}
.side .count.zero{background:var(--sunk);color:var(--ink-faint)}
.side footer{margin-top:auto;padding:12px 18px;border-top:1px solid var(--rule);
  font-size:11.5px;color:var(--ink-faint);line-height:1.45}

main{min-width:0;display:flex;flex-direction:column}
header.bar{
  background:var(--surface);border-bottom:1px solid var(--rule);
  padding:12px 24px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
}
.bar h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.bar .sub{font-size:12.5px;color:var(--ink-faint)}
.chips{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;font-weight:600;padding:3px 8px;border:1px solid currentColor;
  border-radius:2px;white-space:nowrap}
.chip.on{color:var(--ok)} .chip.off{color:var(--bad);background:var(--bad-wash)}
.chip.mute{color:var(--ink-faint)}

.view{padding:22px 24px 64px;max-width:1180px}
.view[hidden]{display:none!important}
h3.sec{margin:0 0 3px;font-size:15px;font-weight:600}
p.note{margin:0 0 14px;font-size:13px;color:var(--ink-soft);max-width:70ch}

/* --- panels & tiles ------------------------------------------------------- */
.panel{background:var(--surface);border:1px solid var(--rule);margin-bottom:20px}
.panel > h4{margin:0;padding:11px 16px;font-size:13.5px;font-weight:600;
  border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.panel > h4 .aside{margin-left:auto;font-size:12px;font-weight:400;color:var(--ink-faint)}
.pad{padding:14px 16px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
  gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:20px}
.tile{background:var(--surface);padding:14px 16px}
.tile .v{font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tile .k{font-size:12.5px;color:var(--ink-soft);margin-top:3px}

.guards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;
  background:var(--rule)}
.guard{background:var(--surface);padding:13px 16px;border-left:3px solid var(--ok)}
.guard.off{border-left-color:var(--bad)}
.guard .n{font-size:13.5px;font-weight:600}
.guard .s{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.guard.off .s{color:var(--bad)}

.warn{border-left:3px solid var(--hold);background:var(--hold-wash);
  padding:11px 16px;margin-bottom:20px;font-size:13px}
.warn b{display:block;margin-bottom:4px}
.warn ul{margin:0;padding-left:18px} .warn li{margin:2px 0}

/* --- tables --------------------------------------------------------------- */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--ink-soft);
  padding:8px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--raised)}
td.r{text-align:right}
.stamp{font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 7px;
  border:1.5px solid currentColor;white-space:nowrap;display:inline-block}
.stamp.allow,td.allow{color:var(--ok)}
.stamp.deny,td.deny{color:var(--bad)}
.stamp.step_up,td.step_up{color:var(--hold)}
.stamp.deny{background:var(--bad-wash)} .stamp.step_up{background:var(--hold-wash)}
/* A severity STRIPE rather than a tinted row: the outcome is one fact about
   the call, not a property of its counterparty or its amount. */
tr.row td:first-child{border-left:3px solid transparent}
tr.row.deny td:first-child{border-left-color:var(--bad)}
tr.row.step_up td:first-child{border-left-color:var(--hold)}
tr.row.allow td:first-child{border-left-color:var(--ok)}
.mono{font-size:12px;color:var(--ink-faint)}

/* --- drill-down ----------------------------------------------------------- */
.detail td{background:var(--sunk);padding:14px 16px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:1px 16px}
.chk{display:flex;gap:8px;align-items:baseline;font-size:12.5px;padding:2px 0}
.chk i{font-style:normal;width:10px;flex:none}
.chk.satisfied i{color:var(--ok)} .chk.satisfied span{color:var(--ink-soft)}
.chk.violated i,.chk.violated span{color:var(--bad);font-weight:600}
.chk.indeterminate i,.chk.indeterminate span{color:var(--hold);font-weight:600}
.why{margin:10px 0 0;font-size:13px;color:var(--ink-soft)}
.why b{color:var(--ink)}

/* --- controls ------------------------------------------------------------- */
.act{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--rule-strong);
  background:var(--surface);padding:5px 12px;font-size:12.5px;font-weight:600;
  cursor:pointer;border-radius:2px}
.act:hover{border-color:var(--ink)}
.act.go{color:var(--ok);border-color:var(--ok)}
.act.go:hover{background:var(--ok-wash)}
.act.stop{color:var(--bad);border-color:var(--bad)}
.act.stop:hover{background:var(--bad-wash)}
.act[disabled]{opacity:.45;cursor:default}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.filters select,.filters input{font:inherit;font-size:13px;padding:5px 8px;
  border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink);
  border-radius:2px}
.filters label{font-size:12.5px;color:var(--ink-soft)}

/* --- approvals ------------------------------------------------------------ */
.req{background:var(--surface);border:1px solid var(--rule);
  border-left:3px solid var(--hold);margin-bottom:12px}
.req .top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;
  padding:13px 16px 0}
.req .what{font-size:15px;font-weight:600}
.req .amt{font-size:15px;font-weight:700}
.req .who{font-size:12.5px;color:var(--ink-faint);margin-left:auto}
.req .delta{padding:8px 16px 0}
.req .delta .said{font-size:13.5px}
/* The control's own wording, kept verbatim and set as supporting detail. It is
   exact and reproducible, which is why it is shown at all; it is also written
   in minor units for an engine that names no currency, which is why it does
   not lead. */
.req .delta .raw{margin:4px 0 0;font-size:12px;color:var(--ink-faint)}
.req .foot{padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.req .meta{font-size:12px;color:var(--ink-faint);margin-left:auto;text-align:right}
.req.done{border-left-color:var(--rule-strong);opacity:.72}

/* --- budget meter --------------------------------------------------------- */
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;
  min-width:110px;margin-top:5px}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.hot{background:var(--hold)} .meter i.over{background:var(--bad)}

/* --- empty ---------------------------------------------------------------- */
.empty{padding:34px 16px;text-align:center;color:var(--ink-soft);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:5px}

/* --- scenario blotter (kept) ---------------------------------------------- */
.lane-heads,.srow{display:grid;grid-template-columns:1fr 104px 1fr}
.lane-heads{border-bottom:2px solid var(--spine)}
.lane-heads div{padding:10px 16px;font-size:13px;font-weight:600}
.lane-heads .mid{text-align:center;color:var(--ink-faint);font-weight:500;
  border-inline:1px solid var(--rule)}
.lane-heads .hL{color:var(--bad)} .lane-heads .hR{color:var(--ok)}
.srow{border-bottom:1px solid var(--rule)}
.cell{padding:12px 16px;min-width:0}
.cell .act2{font-size:13.5px;line-height:1.35}
.cell .meta{margin-top:3px;font-size:12.5px;color:var(--ink-faint);
  display:flex;flex-wrap:wrap;gap:3px 12px}
.struck .act2{text-decoration:line-through;color:var(--ink-faint)}
.gate{border-inline:1px solid var(--rule);display:flex;align-items:center;
  justify-content:center;padding:12px 6px;background:var(--sunk)}
.srow.deny .cell{background:var(--bad-wash)} .srow.step_up .cell{background:var(--hold-wash)}
.swhy{grid-column:1/-1;border-top:1px dashed var(--rule);padding:10px 16px;
  font-size:13px;color:var(--ink-soft);background:var(--surface)}
.scnpick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.scnpick button{border:1px solid var(--rule-strong);background:var(--surface);
  padding:5px 10px;font-size:12.5px;cursor:pointer;border-radius:2px}
.scnpick button[aria-current="true"]{border-color:var(--spine);font-weight:600}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.side{border-right:0;border-bottom:1px solid var(--rule)}
  .side nav{flex-direction:row;flex-wrap:wrap}
  .side footer{display:none}
  .lane-heads,.srow{grid-template-columns:1fr}
  .gate{justify-content:flex-start}
  .view{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <nav class="side">
    <div class="brand">
      <h1>Warrant</h1>
      <p id="deployment">…</p>
    </div>
    <nav id="nav"></nav>
    <footer id="sidefoot"></footer>
  </nav>

  <main>
    <header class="bar">
      <div><h2 id="vtitle">Overview</h2><div class="sub" id="vsub"></div></div>
      <div class="chips" id="chips"></div>
    </header>

    <section class="view" id="v-overview"></section>
    <section class="view" id="v-approvals" hidden></section>
    <section class="view" id="v-decisions" hidden></section>
    <section class="view" id="v-tasks" hidden></section>
    <section class="view" id="v-missions" hidden></section>
    <section class="view" id="v-policy" hidden></section>
    <section class="view" id="v-scenarios" hidden></section>
  </main>
</div>

<script>
const VIEWS = [
  {id:"overview",  label:"Overview",   sub:"What this deployment is enforcing, and what it stopped"},
  {id:"approvals", label:"Approvals",  sub:"Calls paused for a human decision"},
  {id:"decisions", label:"Decisions",  sub:"Every decision this deployment made, and the controls behind it"},
  {id:"tasks",     label:"Tasks",      sub:"Live task trees, their budgets and their delegation"},
  {id:"missions",  label:"Missions",   sub:"The consent each task runs under"},
  {id:"policy",    label:"Policy",     sub:"The boundary this deployment enforces"},
  {id:"scenarios", label:"Evidence",   sub:"The same request answered with and without Warrant"},
];

const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STAMP = {allow:"ALLOWED", deny:"DENIED", step_up:"HELD"};
const money = (minor, cur) => minor
  ? (minor/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})
    + (cur ? " " + cur : "") : "";
const span = s => s < 60 ? Math.max(1, Math.round(s)) + "s"
  : s < 3600 ? Math.round(s/60) + "m" : Math.round(s/3600) + "h";
const ago = t => t ? span(Math.max(0, Math.floor(Date.now()/1000) - t)) + " ago" : "—";
const until = t => {
  if (!t) return "—";
  const s = t - Math.floor(Date.now()/1000);
  return s <= 0 ? "expired" : "in " + span(s);
};
const api = async (path, opts) => {
  const r = await fetch("/api" + path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || body.error || r.status);
  return body;
};

const S = {currency:"", view:"overview", config:null, stats:null, journal:[], approvals:[],
           trees:[], missions:[], scenarios:null, scenario:null, filter:{}, open:null};

/* --- chrome --------------------------------------------------------------- */

function drawNav() {
  const pending = S.approvals.filter(a => a.status === "pending").length;
  document.getElementById("nav").innerHTML = VIEWS.map(v => `
    <button type="button" data-v="${v.id}" aria-current="${v.id === S.view}">
      ${esc(v.label)}
      ${v.id === "approvals"
        ? `<span class="count ${pending ? "" : "zero"}">${pending}</span>` : ""}
    </button>`).join("");
  document.querySelectorAll("#nav button").forEach(b =>
    b.addEventListener("click", () => go(b.dataset.v)));
}

function drawChrome() {
  const c = S.config || {};
  const g = c.guards || {};
  document.getElementById("deployment").textContent = c.deployment || "not connected";
  const chip = (on, onText, offText) =>
    `<span class="chip ${on ? "on" : "off"}">${esc(on ? onText : offText)}</span>`;
  document.getElementById("chips").innerHTML = c.guards ? [
    chip(g.caller_auth?.enabled, "callers authenticated", "callers UNAUTHENTICATED"),
    chip(g.subject_identity?.enabled, "identity verified", "identity UNVERIFIED"),
    chip(g.task_tokens?.required, "task tokens required", "task tokens off"),
    `<span class="chip mute">${esc(c.policy_version || "")}</span>`,
  ].join("") : "";
  document.getElementById("sidefoot").innerHTML = S.stats
    ? `${S.stats.total} of ${S.stats.capacity} decisions held<br>${
        S.trees.length} task${S.trees.length === 1 ? "" : "s"} · ${
        S.missions.length} mission${S.missions.length === 1 ? "" : "s"}`
    : "";
}

function go(view) {
  S.view = view; S.open = null;
  const meta = VIEWS.find(v => v.id === view);
  document.getElementById("vtitle").textContent = meta.label;
  document.getElementById("vsub").textContent = meta.sub;
  VIEWS.forEach(v => document.getElementById("v-" + v.id).hidden = v.id !== view);
  drawNav();
  render();
}

/* --- views ---------------------------------------------------------------- */

function renderOverview() {
  const s = S.stats || {by_effect:{}, top_reasons:[]}, c = S.config || {};
  const e = s.by_effect || {};
  const warnings = (c.warnings || []);
  const g = c.guards || {};
  const guard = (name, on, detail) => `
    <div class="guard ${on ? "" : "off"}">
      <div class="n">${esc(name)}</div><div class="s">${esc(detail)}</div>
    </div>`;

  document.getElementById("v-overview").innerHTML = `
    ${warnings.length ? `<div class="warn"><b>This deployment has gaps</b><ul>${
      warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}

    <div class="tiles">
      <div class="tile"><div class="v num">${e.allow || 0}</div><div class="k">allowed</div></div>
      <div class="tile"><div class="v num deny" style="color:var(--bad)">${e.deny || 0}</div>
        <div class="k">stopped</div></div>
      <div class="tile"><div class="v num" style="color:var(--hold)">${e.step_up || 0}</div>
        <div class="k">sent to a human</div></div>
      <div class="tile"><div class="v num">${esc(money(s.value_stopped_minor, "") || "0.00")}
        <span style="font-size:14px;font-weight:600;color:var(--ink-faint)">${
          esc(S.currency || "")}</span></div>
        <div class="k">value on calls that were stopped</div></div>
    </div>

    <div class="panel">
      <h4>Controls in force</h4>
      <div class="guards">
        ${guard("Caller authentication", g.caller_auth?.enabled,
          g.caller_auth?.enabled
            ? `${(g.caller_auth.clients || []).length} credential(s), scoped`
            : "anyone reaching this service can call it")}
        ${guard("End-user identity", g.subject_identity?.enabled,
          g.subject_identity?.enabled
            ? `verified against ${g.subject_identity.issuer}`
            : "subject asserted by the caller, not verified")}
        ${guard("Task-tree tokens", g.task_tokens?.required,
          g.task_tokens?.required
            ? `key-bound, ${g.task_tokens.ttl_seconds}s, DPoP`
            : "an agent key may assert any node")}
      </div>
    </div>

    <div class="panel">
      <h4>What is stopping calls<span class="aside">by control</span></h4>
      ${(s.top_reasons || []).length ? `<div class="tw"><table>
        <thead><tr><th>Control</th><th>Layer</th><th class="r">Times fired</th></tr></thead>
        <tbody>${s.top_reasons.map(([id, n]) => `<tr>
          <td>${esc(id.replace(/^(pds|token|approval)\./, "").replace(/_/g, " "))}</td>
          <td class="mono">${esc(id.split(".")[0] === "pds" ? "policy engine"
            : id.split(".")[0] === "token" ? "task token" : "step-up")}</td>
          <td class="r num">${n}</td></tr>`).join("")}</tbody></table></div>`
        : `<div class="empty"><b>Nothing has fired yet</b>
             Controls appear here as soon as they stop or pause a call.</div>`}
    </div>

    <div class="panel">
      <h4>Recent decisions<span class="aside">newest first</span></h4>
      ${decisionTable(S.journal.slice(0, 8), false)}
    </div>`;
}

function decisionTable(rows, withFilters) {
  if (!rows.length) return `<div class="empty"><b>No decisions recorded</b>
    Every governed call lands here with the controls that ran on it.</div>`;
  return `<div class="tw"><table>
    <thead><tr>
      <th>When</th><th>Outcome</th><th>Action</th><th>Counterparty</th>
      <th class="r">Amount</th><th>Why</th>
    </tr></thead>
    <tbody>${rows.map(r => `
      <tr class="row ${esc(r.effect)}" data-seq="${r.seq}">
        <td class="mono">${esc(ago(r.at))}</td>
        <td><span class="stamp ${esc(r.effect)}">${esc(STAMP[r.effect] || r.effect)}</span></td>
        <td>${esc(r.action)}</td>
        <td>${esc(r.counterparty || "—")}</td>
        <td class="r num">${esc(money(r.amount_minor, "") || "—")}</td>
        <td class="mono">${esc((r.reasons || []).map(x =>
          x.replace(/^(pds|token|approval)\./, "").replace(/_/g, " ")).join(", ") || "all controls passed")}</td>
      </tr>
      ${S.open === r.seq ? `<tr class="detail"><td colspan="6">
        <div class="checks">${(r.checks || []).map(c => `
          <div class="chk ${esc(c.status)}">
            <i>${c.status === "satisfied" ? "✓" : c.status === "violated" ? "✕" : "?"}</i>
            <span>${esc(c.check_id.replace(/^(pds|token|approval)\./, "").replace(/_/g, " "))}</span>
          </div>`).join("")}</div>
        ${(r.checks || []).filter(c => c.status !== "satisfied").map(c =>
          `<p class="why"><b>${esc(c.check_id)}.</b> ${esc(c.detail)}</p>`).join("")}
        <p class="why mono">task ${esc(r.tree_id)} · node ${esc(r.node_id)} · for ${esc(r.subject)}
          ${r.actor_chain?.length ? " · chain " + esc(r.actor_chain.join(" → ")) : ""}
          ${r.worst_origin ? " · evidence " + esc(r.worst_origin) : ""}</p>
      </td></tr>` : ""}`).join("")}</tbody></table></div>`;
}

function renderDecisions() {
  const f = S.filter;
  document.getElementById("v-decisions").innerHTML = `
    <div class="filters">
      <label>Outcome</label>
      <select id="f-effect">
        ${["", "allow", "deny", "step_up"].map(v =>
          `<option value="${v}" ${f.effect === v ? "selected" : ""}>${
            v ? STAMP[v] : "any"}</option>`).join("")}
      </select>
      <label>Action</label>
      <select id="f-action">
        <option value="">any</option>
        ${(S.config?.action_registry?.actions || []).map(a =>
          `<option value="${esc(a.name)}" ${f.action === a.name ? "selected" : ""}>${
            esc(a.name)}</option>`).join("")}
      </select>
      <label>Control</label>
      <input id="f-reason" placeholder="e.g. injection_tripwire" value="${esc(f.reason || "")}">
      <button class="act" id="f-clear" type="button">Clear</button>
    </div>
    <div class="panel"><h4>Decisions<span class="aside">${S.journal.length} shown</span></h4>
      ${decisionTable(S.journal, true)}</div>`;

  const apply = () => {
    S.filter = {
      effect: document.getElementById("f-effect").value,
      action: document.getElementById("f-action").value,
      reason: document.getElementById("f-reason").value.trim(),
    };
    refreshJournal().then(render);
  };
  document.getElementById("f-effect").onchange = apply;
  document.getElementById("f-action").onchange = apply;
  document.getElementById("f-reason").onchange = apply;
  document.getElementById("f-clear").onclick = () => { S.filter = {}; refreshJournal().then(render); };
}

function renderApprovals() {
  const pending = S.approvals.filter(a => a.status === "pending");
  const done = S.approvals.filter(a => a.status !== "pending").slice(0, 8);
  const card = a => `
    <div class="req ${a.status === "pending" ? "" : "done"}">
      <div class="top">
        <span class="what">${esc(a.action)}${a.counterparty ? " to " + esc(a.counterparty) : ""}</span>
        ${a.amount_minor ? `<span class="amt num">${esc(money(a.amount_minor, a.currency))}</span>` : ""}
        <span class="who">for ${esc(a.approver)}</span>
      </div>
      <div class="delta">
        <div class="said">${esc(a.reasons?.includes("pds.counterparty_scope")
          ? "This counterparty is not on the approved list for this task."
          : a.reasons?.includes("pds.budget")
          ? "This call would take the task past the budget you approved."
          : "This call falls outside the boundary you approved.")}</div>
        ${(a.delta || []).map(d => `<p class="raw">${esc(d)}</p>`).join("")}
      </div>
      <div class="foot">
        ${a.status === "pending" ? `
          <button class="act go" data-ok="${esc(a.approval_id)}">Approve this call</button>
          <button class="act stop" data-no="${esc(a.approval_id)}">Decline</button>`
        : `<span class="stamp ${a.status === "approved" ? "allow" : "deny"}">${
            esc(a.status.toUpperCase())}</span>
           <span class="mono">by ${esc(a.decided_by)}${
             a.decided_via && a.decided_via !== a.decided_by
               ? ` (via ${esc(a.decided_via)})` : ""}${a.note ? ` — ${esc(a.note)}` : ""}</span>`}
        <span class="meta">request ${esc(a.approval_id.slice(0, 8))}<br>
          ${a.status === "pending" ? "expires " + esc(until(a.expires_at))
            : esc(ago(a.decided_at))}
          ${(a.delivery || []).length ? " · sent via " + esc(a.delivery.join(", ")) : ""}</span>
      </div>
    </div>`;

  document.getElementById("v-approvals").innerHTML = `
    <h3 class="sec">Waiting on a person</h3>
    <p class="note">A call the agent may not make on its own. Approving releases
      <b>this call only</b> — the approval is spent when used, so it cannot cover
      the next one. Nothing here can lift a denial.</p>
    ${pending.length ? pending.map(card).join("")
      : `<div class="panel"><div class="empty"><b>Nothing is waiting</b>
           Calls that cross a boundary the operator can extend appear here.</div></div>`}
    ${done.length ? `<h3 class="sec" style="margin-top:22px">Recently answered</h3>
      ${done.map(card).join("")}` : ""}`;

  document.querySelectorAll("[data-ok]").forEach(b =>
    b.onclick = () => answer(b.dataset.ok, true, b));
  document.querySelectorAll("[data-no]").forEach(b =>
    b.onclick = () => answer(b.dataset.no, false, b));
}

async function answer(id, ok, button) {
  button.disabled = true;
  button.textContent = ok ? "Approving…" : "Declining…";
  try {
    await api(`/v1/approvals/${id}/${ok ? "approve" : "deny"}`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({note: ok ? "approved from the console" : "declined from the console"}),
    });
    await refreshAll();
  } catch (e) {
    button.disabled = false;
    button.textContent = "Could not: " + e.message;
  }
}

function renderTasks() {
  document.getElementById("v-tasks").innerHTML = `
    <p class="note">One task tree per unit of work. Sub-agents get narrower
      grants by exchange only, and the budget is the tree's — fanning out does
      not multiply the ceiling.</p>
    <div class="panel"><h4>Tasks<span class="aside">${S.trees.length}</span></h4>
    ${S.trees.length ? `<div class="tw"><table>
      <thead><tr><th>Task</th><th>For</th><th>Nodes</th><th>Calls</th>
        <th>Budget used</th><th>State</th><th></th></tr></thead>
      <tbody>${S.trees.map(t => {
        const cap = t.budget.amount_minor, used = t.budget.committed + t.budget.outstanding;
        const pct = cap ? Math.min(100, Math.round(used / cap * 100)) : 0;
        return `<tr>
          <td class="mono">${esc(t.tree_id)}</td>
          <td>${esc(t.subject)}</td>
          <td class="num">${t.nodes}</td>
          <td class="num">${t.calls}</td>
          <td>${cap ? `<div class="num">${esc(money(used, t.budget.currency))} of ${
                esc(money(cap, ""))}</div>
              <div class="meter"><i class="${pct > 90 ? "over" : pct > 70 ? "hot" : ""}"
                style="width:${pct}%"></i></div>` : `<span class="mono">uncapped</span>`}</td>
          <td>${t.revoked
            ? `<span class="stamp deny">REVOKED</span><div class="mono">${esc(t.revoked_reason)}</div>`
            : `<span class="stamp allow">RUNNING</span>`}</td>
          <td class="r">${t.revoked ? "" :
            `<button class="act stop" data-revoke="${esc(t.tree_id)}">Stop this task</button>`}</td>
        </tr>`;
      }).join("")}</tbody></table></div>`
      : `<div class="empty"><b>No tasks</b> A task appears when an agent opens one.</div>`}
    </div>`;

  document.querySelectorAll("[data-revoke]").forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = "Stopping…";
    try {
      await api(`/v1/trees/${b.dataset.revoke}/revoke`, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({reason: "stopped from the console"}),
      });
      await refreshAll();
    } catch (e) { b.disabled = false; b.textContent = "Could not: " + e.message; }
  });
}

function renderMissions() {
  document.getElementById("v-missions").innerHTML = `
    <p class="note">One consent screen, signed. Every task runs inside exactly
      one of these, and nothing an agent does can widen it.</p>
    <div class="panel"><h4>Missions<span class="aside">${S.missions.length}</span></h4>
    ${S.missions.length ? `<div class="tw"><table>
      <thead><tr><th>Mission</th><th>Approved by</th><th>May do</th><th>With</th>
        <th class="r">Budget</th><th>Depth</th><th>State</th></tr></thead>
      <tbody>${S.missions.map(m => `<tr>
        <td class="mono">${esc(m.mission_id)}</td>
        <td>${esc(m.subject)}</td>
        <td>${(m.action_classes || []).map(esc).join("<br>") || "<span class='mono'>any</span>"}</td>
        <td>${(m.counterparties || []).map(esc).join("<br>") || "<span class='mono'>any</span>"}</td>
        <td class="r num">${esc(money(m.budget?.amount_minor, m.budget?.currency) || "uncapped")}</td>
        <td class="num">${m.max_depth}</td>
        <td>${m.current ? `<span class="stamp allow">CURRENT</span>`
          : `<span class="stamp deny">RETIRED</span>${m.superseded_by
             ? `<div class="mono">by ${esc(m.superseded_by)}</div>` : ""}`}</td>
      </tr>`).join("")}</tbody></table></div>`
      : `<div class="empty"><b>No missions issued</b></div>`}
    </div>`;
}

function renderPolicy() {
  const c = S.config || {}; const g = c.guards || {};
  const reg = c.action_registry || {actions: []};
  document.getElementById("v-policy").innerHTML = `
    <p class="note">What this deployment enforces. Every value here comes from
      the environment or a mounted file, so changing one is a deploy — a change
      to what an agent may do leaves a trace in your own change management, and
      cannot be made by anyone who merely reaches this console.</p>

    <div class="panel">
      <h4>Action classes<span class="aside">${esc(reg.version || "")} · ${
        esc(reg.source || "not configured")}</span></h4>
      <div class="tw"><table>
        <thead><tr><th>Action</th><th>Blast radius</th><th>Changes the world</th>
          <th>Description</th></tr></thead>
        <tbody>${(reg.actions || []).map(a => `<tr>
          <td class="mono">${esc(a.name)}</td>
          <td><span class="stamp ${a.blast_radius === "high" ? "deny"
            : a.blast_radius === "medium" ? "step_up" : "allow"}">${
            esc(a.blast_radius.toUpperCase())}</span></td>
          <td>${a.side_effect ? "yes" : "no"}</td>
          <td>${esc(a.description || "")}</td></tr>`).join("")
          || `<tr><td colspan="4" class="empty"><b>No action classes configured</b>
                Every side-effect call fails closed until one is.</td></tr>`}
        </tbody></table></div>
    </div>

    <div class="panel">
      <h4>Who may call this service</h4>
      <div class="tw"><table>
        <thead><tr><th>Credential</th><th>May</th><th>Purpose</th></tr></thead>
        <tbody>${(g.caller_auth?.clients || []).map(cl => `<tr>
          <td class="mono">${esc(cl.client_id)}</td>
          <td>${(cl.scopes || []).map(esc).join(", ")}</td>
          <td>${esc(cl.description || "")}</td></tr>`).join("")
          || `<tr><td colspan="3" class="empty"><b>Caller authentication is off</b></td></tr>`}
        </tbody></table></div>
    </div>

    <div class="panel"><h4>Identity, tokens and step-up</h4><div class="pad">
      <div class="tw"><table><tbody>
        <tr><td><b>End-user identity</b></td><td>${g.subject_identity?.enabled
          ? `verified against ${esc(g.subject_identity.issuer)}, audience
             <span class="mono">${esc(g.subject_identity.audience)}</span>,
             ${esc((g.subject_identity.algorithms || []).join(", "))}`
          : "not verified — the subject is whatever the caller says"}</td></tr>
        <tr><td><b>Task tokens</b></td><td>${g.task_tokens?.required
          ? `required · ${g.task_tokens.ttl_seconds}s lifetime · DPoP proof window
             ${g.task_tokens.dpop_window_seconds}s`
          : "not required — an agent key may assert any node"}</td></tr>
        <tr><td><b>Step-up</b></td><td>requests expire after ${
          c.step_up?.ttl_seconds ?? "—"}s · delivered via
          ${esc((c.step_up?.channels || []).join(", ") || "nothing")}</td></tr>
        <tr><td><b>Decision journal</b></td><td class="num">${
          c.journal?.stored ?? 0} of ${c.journal?.capacity ?? 0} held in memory</td></tr>
      </tbody></table></div>
    </div></div>`;
}

function renderScenarios() {
  const run = S.scenarios;
  const el = document.getElementById("v-scenarios");
  if (!run) { el.innerHTML = `<div class="empty">Loading…</div>`; return; }
  const cur = run.scenarios.find(s => s.key === S.scenario) ||
              run.scenarios.find(s => s.key === run.open_on) || run.scenarios[0];
  S.scenario = cur.key;

  const lane = (step, side) => {
    const gone = side === "r" && step.outcome !== "executed";
    return `<div class="cell ${gone ? "struck" : ""}">
      <div class="act2">${esc(step.narrative)}${step.amount
        ? ` <b class="num">${esc(step.amount)}</b>` : ""}</div>
      ${step.counterparty || step.resource ? `<div class="meta">
        ${step.counterparty ? `<span>${esc(step.counterparty)}</span>` : ""}
        ${step.resource ? `<span>${esc(step.resource)}</span>` : ""}</div>` : ""}
    </div>`;
  };

  el.innerHTML = `
    <p class="note">${esc(run.decided_by ? "Decided by the " + run.decided_by + "." : "")}
      ${esc(run.identity_from ? " The operator's identity was verified against "
        + run.identity_from + ", not asserted by the agent." : "")}</p>
    <div class="scnpick">${run.scenarios.map(s =>
      `<button type="button" data-s="${esc(s.key)}" aria-current="${s.key === cur.key}">${
        esc(s.key)}</button>`).join("")}</div>

    <h3 class="sec">${esc(cur.title)}</h3>
    <p class="note">${esc(cur.question)}</p>

    <div class="panel">
      <div class="lane-heads">
        <div class="hL">No control on the call path</div>
        <div class="mid">Decision</div>
        <div class="hR">Through Warrant</div>
      </div>
      ${cur.lanes.governed.steps.map((g, i) => {
        const u = cur.lanes.ungoverned.steps[i] || g;
        return `<div class="srow ${esc(g.effect)}">
          ${lane(u, "l")}
          <div class="gate"><span class="stamp ${esc(g.effect)}">${
            esc(STAMP[g.effect] || "—")}</span></div>
          ${lane(g, "r")}
          ${g.effect !== "allow" && g.detail ? `<div class="swhy">
            <b>${g.effect === "step_up" ? "Sent to the operator." : "Why it stopped."}</b>
            ${esc(g.detail)}</div>` : ""}
        </div>`;
      }).join("")}
    </div>

    <div class="panel"><div class="pad" style="display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px">
      <div><b style="color:var(--bad)">What happens today</b>
        <p class="why">${esc(cur.ungoverned_story)}</p></div>
      <div><b style="color:var(--ok)">What Warrant does</b>
        <p class="why">${esc(cur.governed_story)}</p></div>
    </div></div>`;

  el.querySelectorAll("[data-s]").forEach(b =>
    b.onclick = () => { S.scenario = b.dataset.s; renderScenarios(); });
}

function render() {
  drawChrome();
  ({overview: renderOverview, approvals: renderApprovals, decisions: renderDecisions,
    tasks: renderTasks, missions: renderMissions, policy: renderPolicy,
    scenarios: renderScenarios})[S.view]();

  document.querySelectorAll("tr.row").forEach(tr => tr.onclick = () => {
    const seq = Number(tr.dataset.seq);
    S.open = S.open === seq ? null : seq;
    render();
  });
}

/* --- data ----------------------------------------------------------------- */

async function refreshJournal() {
  const q = new URLSearchParams();
  if (S.filter.effect) q.set("effect", S.filter.effect);
  if (S.filter.action) q.set("action", S.filter.action);
  if (S.filter.reason) q.set("reason", "pds." + S.filter.reason.replace(/^pds\./, ""));
  q.set("limit", "200");
  S.journal = (await api("/v1/journal?" + q)).entries || [];
}

async function refreshAll() {
  const [config, stats, approvals, trees, missions] = await Promise.all([
    api("/v1/config"), api("/v1/journal/stats"), api("/v1/approvals"),
    api("/v1/trees"), api("/v1/missions"),
  ]);
  S.config = config; S.stats = stats;
  S.approvals = approvals.approvals || [];
  S.trees = trees.trees || []; S.missions = missions.missions || [];
  // Taken from the estate rather than configured: the currency is a property
  // of the tasks running, and the engine has no opinion about it.
  S.currency = (S.trees.find(t => t.budget?.currency) || {}).budget?.currency || "";
  await refreshJournal();
  drawNav(); render();
}

async function boot() {
  try {
    S.scenarios = await fetch("/api/scenarios").then(r => r.json());
  } catch (e) { S.scenarios = null; }
  try {
    await refreshAll();
  } catch (e) {
    document.getElementById("v-overview").innerHTML = `
      <div class="warn"><b>Cannot reach the enforcement service</b>
        ${esc(e.message)}. Start the stack with
        <code>docker compose -f docker-compose.warrant.yml up -d</code> and reload.</div>`;
  }
  go("overview");
  // A control plane that needs a manual refresh is a dashboard, not a console.
  setInterval(() => refreshAll().catch(() => {}), 5000);
}

boot();
</script>
