# LoanPro — a worked example deployment, SEPARATE from the Prefront engine's
# own compose project (../docker-compose.yaml). This is its own Compose
# project (`name:` below) with its own network/volumes by default, EXCEPT for
# the two things it shares with the engine: the engine's default network
# (`prefront_default`) and its `artifacts` named volume (`prefront_artifacts`)
# — both declared `external: true` below, so Docker's embedded DNS lets these
# containers resolve engine services by name (`oob-ingest`, `phoenix`, …) and
# vice versa, with no cross-project `depends_on` (Compose can't depend_on a
# service in another project — only within one `docker compose` invocation).
#
#   loanpro-db            LoanPro's own Postgres                      :5435
#   loanpro-app-mcp       the shop's own tool API, ungoverned MCP      :8102
#   loanpro-ungoverned    the agent (LLM as MCP client)                :8097
#   loanpro-orchestrator  scenario catalogue runner                    :8098
#   verdict               standalone scenario-runner UI (nginx)        :5180
#   loanpro-mcp           Prefront's governed MCP for LoanPro (unused, :8101
#                         profile `mcp` only)
#
# Quick start (engine must already be up — see ../docker-compose.yaml):
#   docker compose -f docker-compose.yml up --build -d
# From the repo root, equivalently:
#   docker compose -f loanpro-demo/docker-compose.yml up --build -d
#
# LoanPro is the demo the OOB check families (prefront-check-families.md) are
# built against — see this directory's own README + docs/check-coverage.md.

name: prefront-loanpro-demo

x-llm-env: &llm-env
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

x-tracing-env: &tracing-env
  PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006}
  PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-prefront}
  PREFRONT_TRACING: ${PREFRONT_TRACING:-1}

# Out-of-band tap: only the app-layer (ungoverned) agent fans spans out to the
# engine's oob-ingest — resolved by name across the shared network.
x-oob-tap-env: &oob-tap-env
  PREFRONT_TRACE_FANOUT: ${PREFRONT_TRACE_FANOUT:-http://oob-ingest:8110}

# The orchestrator DOES trace (its `scenario <id>` span is the app-agent
# trace's root), but there is no governed branch to exclude any more
# (loanpro-mcp is unused by default) — kept for parity with securebank-demo's
# compose and in case loanpro-mcp is ever exercised alongside it.
x-no-governed-span-env: &no-governed-span-env
  PREFRONT_TRACE_EXCLUDE_SPANS: ${PREFRONT_TRACE_EXCLUDE_SPANS:-governed agent}

services:
  loanpro-db:
    image: postgres:16
    environment:
      POSTGRES_USER: loanpro
      POSTGRES_PASSWORD: loanpro
      POSTGRES_DB: loanpro
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - loanpro_pgdata:/var/lib/postgresql/data
    ports: ["5435:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanpro -d loanpro"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- the loan shop's OWN tool API, served over MCP (ungoverned) ----------
  # This is the application's API — typed business functions over its Postgres,
  # exposed as MCP tools. No Prefront, no policy, no decision: a call arrives and
  # the SQL runs. Identity is a per-connection header the agent cannot set, but
  # only get_my_applications() honours it — that is the governance gap on show.
  loanpro-app-mcp:
    build: .
    command: ["python", "app_mcp_server.py"]
    environment:
      <<: [*tracing-env, *oob-tap-env]   # app-layer, so it IS observed by OOB
      LOANPRO_DSN: postgresql://loanpro:loanpro@loanpro-db:5432/loanpro
      LOANPRO_APP_MCP_PORT: "8102"
      LOANPRO_READONLY: "on"             # writes execute, then roll back
      LOANPRO_TRACE_ROWS: "20"           # rows kept in each tool span's output.value
      PREFRONT_TRACE_MAX_VALUE: "16000"  # tool results carry rows: don't clip them at 4k
    ports: ["8102:8102"]
    depends_on:
      loanpro-db: {condition: service_healthy}

  # ---- the agent: an LLM that reaches its tools as an MCP CLIENT -----------
  # No DSN here — the agent never touches the database, it only calls tools.
  # Keeps a server-side conversation per session id (POST /sessions, then
  # /sessions/{id}/messages or /replay) — the traces are the OOB checks' subject.
  loanpro-ungoverned:
    build: .
    command: ["python", "ungoverned_server.py"]
    environment:
      <<: [*llm-env, *tracing-env, *oob-tap-env]   # OPENAI_API_KEY; OOB tap
      UNGOVERNED_MODEL: gpt-4o-mini
      UNGOVERNED_MODEL_V2: ${LOANPRO_MODEL_V2:-gpt-4o-mini}   # prompt/model variant v2
      UNGOVERNED_MAX_ITERS: "6"          # multi-tool sessions need more round-trips
      UNGOVERNED_PORT: "8097"
      LOANPRO_APP_MCP_URL: http://loanpro-app-mcp:8102/sse
      PREFRONT_TRACE_MAX_VALUE: "16000"
    ports: ["8097:8097"]
    depends_on:
      loanpro-app-mcp: {condition: service_started}

  # ---- seed the curated LoanPro artifacts into the engine's shared volume --
  # Idempotent copy into the demo-owned /artifacts/loanpro-demo/ dir — also
  # where rule_pack.yaml/intent_catalog.yaml land now, so the engine's
  # eval-engine (../docker-compose.yaml) can read them via the SAME shared
  # `artifacts` volume by setting EVAL_RULE_PACK_PATH/EVAL_INTENT_CATALOG_PATH
  # in your .env, with no bind mount of this directory needed on the engine
  # side (see that file's eval-engine comment).
  loanpro-seed:
    image: alpine
    command:
      - sh
      - -c
      - mkdir -p /artifacts/loanpro-demo &&
        ([ -f /artifacts/loanpro-demo/query_templates.yaml ] ||
         cp /src/query_templates.yaml /src/policy.yaml /src/rule_pack.yaml /src/intent_catalog.yaml
            /artifacts/loanpro-demo/) &&
        echo "loanpro curated artifacts ready in /artifacts/loanpro-demo"
    volumes:
      - artifacts:/artifacts
      - ./policy:/src:ro
    restart: "no"

  # ---- Prefront, exposed as ONE MCP server (the single endpoint the LLM uses)
  # Prefront's governed MCP for LoanPro. UNUSED — LoanPro has no governed agent
  # any more, so this sits behind the `mcp` profile with the engine runtime.
  loanpro-mcp:
    profiles: ["mcp"]
    build: ../semantic-mcp-server
    command: ["--templates=/artifacts/loanpro-demo/query_templates.yaml", "serve", "--http", "--host=0.0.0.0", "--port=8090"]
    environment:
      <<: *tracing-env
      PREFRONT_TRACING: ${PREFRONT_ENGINE_TRACING:-0}   # Prefront runtime: not traced
      IDENTITY_QUERY: SELECT user_id, name, email, role FROM users WHERE email = :who
      DATABASE_URL: postgresql://loanpro:loanpro@loanpro-db:5432/loanpro
      POLICY_PATH: /artifacts/loanpro-demo/policy.yaml
      # Inline reuse of eval-engine's safe checks (autonomous_build.md step 18,
      # see semanticmcp/governance/inline_checks.py) - a direct bind mount, not
      # the artifacts NAMED VOLUME's seed-once pattern (that has a documented
      # staleness trap in the root CLAUDE.md); same approach eval-engine uses.
      PREFRONT_RULE_PACK_PATH: /loanpro-policy/rule_pack.yaml
      PREFRONT_INTENT_CATALOG_PATH: /loanpro-policy/intent_catalog.yaml
    volumes:
      - artifacts:/artifacts:ro          # shared with the engine; read-only here
      - ./policy:/loanpro-policy:ro
    ports: ["8101:8090"]                 # host 8101 (engine MCP owns 8090, securebank 8100)
    depends_on:
      loanpro-db: {condition: service_healthy}
      loanpro-seed: {condition: service_completed_successfully}

  # ---- scenario orchestrator: runs the catalogue against the app agent -----
  loanpro-orchestrator:
    build: .
    command: ["python", "demo_server.py"]
    environment:
      <<: [*llm-env, *tracing-env, *no-governed-span-env]   # OPENAI_API_KEY
      LOANPRO_DEMO_PORT: "8098"
      AGENT_URL: http://loanpro-ungoverned:8097
    ports: ["8098:8098"]
    depends_on:
      loanpro-ungoverned: {condition: service_started}

  # ---- Verdict: standalone LoanPro scenario runner (nginx, static) ---------
  # The main Prefront UI's old Runtime tab (SessionRunner), pulled out into
  # its own small app so it can run/be shared independently of the
  # design-time Prefront UI — and now lives in the LoanPro demo compose
  # since that's exactly what it is: a LoanPro-specific tool, not part of the
  # engine. Orchestrator calls are cross-origin fetches at an absolute URL
  # (it already sends permissive CORS); the one relative path (oob-ingest
  # session lookups) is proxied by its own nginx conf (verdict-nginx.conf),
  # resolved by name across the shared network same as every other
  # engine-facing call here.
  verdict:
    build:
      context: ../prefront-ui
      dockerfile: Dockerfile.verdict
    ports: ["5180:80"]
    depends_on:
      - loanpro-orchestrator

networks:
  default:
    name: prefront_default
    external: true

volumes:
  loanpro_pgdata:
  artifacts:
    name: prefront_artifacts
    external: true
