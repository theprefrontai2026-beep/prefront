# LoanPro's GOVERNED query templates — Prefront's MCP surface in front of the
# app's own MCP server (loanpro-app-mcp). GENERATED, then re-keyed; see below.
#
# Produced deterministically by the generic MCP connector, NOT by hand and NOT
# by the LLM mapper: POST /design/semantic/mcp/introspect against
# http://loanpro-app-mcp:8102/sse learns the 19 tools, /build represents each
# as one kind="mcp" template (1 tool = 1 entity, no entity-guessing), and
# /publish writes this file. Regenerate the same way rather than editing it —
# the params below are the tools' OWN declared inputSchemas.
#
# TWO deliberate post-generation edits, both taken from
# policy/intent_catalog.yaml, which is the only place the mapping exists:
#
#  1. intent_id is the APPROVED INTENT name, not the tool name. The connector
#     can only know the tool (view_applicant's tool is get_applicant_profile),
#     but the app stamps `app.intent` on its spans with the approved-intent
#     name and family3's catalog is keyed by it — so a template published under
#     the raw tool name fails catalog_membership on every call. Exposing intent
#     names is also the correct posture: Prefront publishes approved intents,
#     and mcp_tool_name carries the real upstream tool it proxies to.
#
#  2. mcp_destructive comes from the catalog's declared side_effect. The app's
#     MCP server declares no annotations at all, and _is_destructive marks a
#     tool destructive only on a POSITIVE declaration (silence never does), so
#     every write would otherwise publish as non-destructive and skip the
#     ENABLE_WRITES gate.
#
# The 2 OFF-CATALOG tools (search_applicants, get_internal_metrics — INTENTS
# maps both to None) are deliberately NOT here: they were rejected at review,
# so Prefront never exposes them and an agent cannot call them at all. That is
# the inline counterpart of the off-catalog finding Family 3 reports OOB.
query_templates:
  tmpl_apply_discount_mcp_v1:
    intent_id: apply_discount
    description: Apply a rate discount, in basis points, to an application's APR.
    semantic_model_id: loanpro
    semantic_model_version: '1.0'
    kind: mcp
    semantic_entities:
    - apply_discount
    read_only: true
    dialect: mcp
    sql: ''
    mcp_server_url: http://loanpro-app-mcp:8102/sse
    mcp_tool_name: apply_discount
    parameters:
    - name: loan_id
      type: integer
      required: true
    - name: bps
      type: integer
      required: true
    required_policies:
    - loanpro-demo_mcp
    - apply_discount_mcp_default
    status: approved
    template_id: tmpl_apply_discount_mcp_v1
    mcp_destructive: true
