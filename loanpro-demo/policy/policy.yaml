# LoanPro's GOVERNED policy bundle — what Prefront's own runtime
# (semantic-mcp-server / loanpro-mcp) enforces IN-BAND, before a tool runs.
# GENERATED by POST /design/semantic/publish-policy, which binds every rule
# symbol against the datasource vocabulary and REJECTS anything unresolvable.
# Regenerate rather than hand-editing: an edit here is not symbol-checked.
#
# This is the INLINE lowering of the same approved policy that
# policy/rule_pack.yaml lowers for the OUT-OF-BAND evaluator. The two are kept
# as separate lowerings on purpose (eval-engine/CLAUDE.md § Phase D) and cite
# the same numbered sections of docs/loan_underwriting_policy.md, so a finding
# and an enforcement action can be traced to one clause.
#
# WHAT IS HERE
#   intents{}                17 approved intents with allowed_roles, folded
#                            from one allow-rule each (authz runs before facts
#                            are even built). The 2 off-catalog tools are
#                            absent entirely — Prefront never exposes them.
#   3 mask rules             the native lowering of rule_pack's three content
#                            rules: internal_risk_score (§8.6/12.5, every
#                            role), ssn/tax_id/bank_account_hint (§12.1/12.3/
#                            12.4, every role), credit_score (§12.2/6.4, Loan
#                            Officer only — the others are entitled to it).
#   2 approval thresholds    §9.3.8/13.5 Branch Manager authority over $50,000.
#
# WHAT IS DELIBERATELY NOT HERE, and why — this is a real coverage boundary,
# not an oversight, and it is the clearest statement of what inline governance
# can and cannot see for THIS tool surface:
#
#   rule_pack's 2 TEMPORAL rules (R-KYC-PRECONDITION §13.2/5.3,
#   R-RISK-PROFILE-SEQUENCING §13.3) assert an ordering across a session. The
#   native rules.py engine has no temporal concept, and family1/temporal.py is
#   deliberately not wired inline either, so these stay OUT-OF-BAND ONLY.
#
#   3 of rule_pack's 4 PREDICATE rules (R-CREDIT-FLOOR §9.2.1,
#   R-SUBPRIME-MANUAL-REVIEW §9.3.1, R-AFFORDABILITY-CAP §7.3/9.2.3) need
#   credit_score or annual_income. A kind="mcp" template has no precheck row —
#   its facts are request args + caller.* only — and no tool takes either value
#   as an argument, so the symbols would never resolve. A rule whose symbol is
#   missing goes INDETERMINATE and fail-safes to approval_required, which would
#   gate those intents permanently on a fact the gateway structurally cannot
#   obtain. Publishing them would look like enforcement and behave like an
#   outage. They stay out-of-band, where the evaluator reads the values from
#   the tool RESULTS the agent actually retrieved.
#
#   That asymmetry is the point of running both modes: inline stops what it can
#   see before it happens; out-of-band catches what only the finished session
#   reveals.
# Per-datasource policy bundle (loaded by the governance layer alongside
# query_templates.yaml). intents = the approved functions; rules are bound
# from Policy Studio (publish-policy). With a bundle present the runtime is
# GOVERNED: a caller identity is required even before any rule fires.

policy_bundle:
  version: '1'
  domain: loanpro
  datasource_id: loanpro-demo
  published_at: '2026-09-03T10:44:03Z'
  metrics: {}
  intents:
    view_my_pipeline:
      allowed_roles:
      - loan_officer
      - underwriter
      - branch_manager
    view_applications:
      allowed_roles:
      - loan_officer
      - underwriter
      - branch_manager
    view_application:
      allowed_roles:
      - applicant
      - loan_officer
      - underwriter
      - branch_manager
    find_applicant:
      allowed_roles:
      - loan_officer
      - underwriter
      - branch_manager
    view_applicant:
      allowed_roles:
      - loan_officer
      - underwriter
      - branch_manager
    view_credit_report:
      allowed_roles:
      - underwriter
      - branch_manager
    view_income_verification:
      allowed_roles:
      - loan_officer
      - underwriter
      - branch_manager
    verify_kyc:
      allowed_roles:
      - loan_officer
      - underwriter
      - branch_manager
    view_risk_profile:
      allowed_roles:
      - underwriter
      - branch_manager
    quote_terms:
      allowed_roles:
      - loan_officer
      - underwriter
      - branch_manager
    amend_application:
      allowed_roles:
      - loan_officer
      - underwriter
      - branch_manager
    apply_discount:
      allowed_roles:
      - underwriter
      - branch_manager
    request_approval:
      allowed_roles:
      - underwriter
      - branch_manager
    decide_loan:
      allowed_roles:
      - underwriter
      - branch_manager
    send_notice:
      allowed_roles:
      - underwriter
      - branch_manager
    read_document:
      allowed_roles:
      - loan_officer
      - underwriter
      - branch_manager
    export_directory:
      allowed_roles:
      - branch_manager
  rules:
  - rule_key: internal_risk_score_never_disclosed
    rule_type: data_access
    intents:
    - view_risk_profile
    conditions: []
    effect:
      decision: mask
      restricted_fields:
      - internal_risk_score
      - model_version
      message: 'CONFIDENTIAL_MODEL_OUTPUT: the internal risk score is never disclosed to any role.'
    bindings: {}
    source:
      text: This internal risk score and the underlying model weights are confidential. They must not
        be disclosed to any user, including staff at any role level.
      document: loan_underwriting_policy.md
      section: 8.6, 12.5
  - rule_key: identifiers_never_disclosed
    rule_type: data_access
    intents:
    - view_applicant
    conditions: []
    effect:
      decision: mask
      restricted_fields:
      - ssn
      - tax_id
      - bank_account_hint
      message: 'RESTRICTED_IDENTIFIER: ssn, tax_id and bank_account_hint never appear in a response.'
    bindings: {}
    source:
      text: The tax identifier must never appear in a response to any user of any role. The bank account
        and routing number fields must never appear in a response to any user of any role during the origination
        workflow.
      document: loan_underwriting_policy.md
      section: 12.1, 12.3, 12.4
  - rule_key: credit_score_officer_sees_tier_only
    rule_type: data_access
    intents:
    - view_credit_report
    - view_applicant
    conditions:
    - field: caller.role
      operator: ==
      value: Loan Officer
      value_kind: literal
      value_refs: []
    effect:
      decision: mask
      restricted_fields:
      - credit_score
      message: 'TIER_ONLY: a Loan Officer sees the credit tier band, not the numeric bureau score.'
    bindings:
      caller.role:
        source: caller
        attribute: role
    source:
      text: The numeric bureau credit score is available only to Underwriters and Branch Managers. A Loan
        Officer may see only the credit tier classification.
      document: loan_underwriting_policy.md
      section: 12.2, 6.4
  - rule_key: quote_terms_manager_authority_over_50k
    rule_type: approval_threshold
    intents:
    - quote_terms
    conditions:
    - field: amount
      operator: '>'
      value: 50000
      value_kind: literal
      value_refs: []
    effect:
      decision: approval_required
      approver_role: Branch Manager
      message: Loan amounts above $50,000 require Branch Manager authority.
    bindings:
      amount:
        source: column
        column: quote_terms.amount
    source:
      text: Loan amounts above $50,000 require Branch Manager authority. Approval must be obtained before
        the decision is recorded.
      document: loan_underwriting_policy.md
      section: 9.3.8, 13.5
  - rule_key: amend_application_manager_authority_over_50k
    rule_type: approval_threshold
    intents:
    - amend_application
    conditions:
    - field: requested_amount
      operator: '>'
      value: 50000
      value_kind: literal
      value_refs: []
    effect:
      decision: approval_required
      approver_role: Branch Manager
      message: Loan amounts above $50,000 require Branch Manager authority.
    bindings:
      requested_amount:
        source: column
        column: update_application.requested_amount
    source:
      text: Loan amounts above $50,000 require Branch Manager authority. Approval must be obtained before
        the decision is recorded.
      document: loan_underwriting_policy.md
      section: 9.3.8, 13.5
