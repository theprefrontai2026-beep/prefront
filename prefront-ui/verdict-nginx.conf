# Serve Verdict's built SPA and reverse-proxy the relative paths it makes:
# SessionDetail's oob-ingest calls (/oob/sessions/:id) and eval-engine's
# verdict/conformance calls (/eval/sessions/:id/*). Everything else (the
# orchestrator's /api/*) is a plain cross-origin fetch the browser handles
# directly — that service already sends permissive CORS headers.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # OOB observability query API -> oob-ingest (ClickHouse-backed).
    location /oob/ {
        proxy_pass http://oob-ingest:8110;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Evaluation engine query API -> eval-engine (findings/verdicts/conformance).
    location /eval/ {
        proxy_pass http://eval-engine:8120;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Content-hashed build assets can cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML entrypoint, so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
